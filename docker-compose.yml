services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qbo_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d qbo_sync']
      interval: 3s
      timeout: 3s
      retries: 10
